spring:
  application:
    name: configserver
  profiles:
    active: native
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    connection-timeout: 30000
  cloud:
    config:
      server:
        native:
          search-locations: file:///D:\My Profile\Java\projects\ecom-microservices\configserver\src\main\resources\config
server:
  port: 8888
management:
  endpoints:
    web:
      exposure:
        include: "*"
